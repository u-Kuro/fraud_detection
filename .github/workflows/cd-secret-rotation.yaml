name: CD — Secret Rotation (Zero-Downtime)

# Triggered manually or by a scheduled rotation event.
# Rotating: POSTGRES_PASSWORD, SLACK_BOT_USER_AUTH_TOKEN, or any other credential.
# Pattern:
#   0. Expand — write both OLD_KEY and NEW_KEY into Secrets Manager superset
#   1. Auth — static test creds for ministack (swap to OIDC in production)
#   2. Build & push — re-tag the existing :latest so Helm sees a new rollout
#   3. Apply superset secret to k8s
#   4. Rolling update — old pods keep OLD_KEY, new pods have both
#   5. Contract — once rollout is complete, remove OLD_KEY from Secrets Manager

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which secret to rotate: fraud-api | mle-runtime"
        required: true
        default: "fraud-api"
        type: choice
        options: [fraud-api, mle-runtime]
      new_secret_value:
        description: "The new credential value to rotate in"
        required: true
        type: string
      secret_key:
        description: "The JSON key to rotate (e.g. POSTGRES_PASSWORD)"
        required: true
        type: string

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      SM_ENDPOINT: http://ministack:4566
      SECRET_ID: "/fraud-detection/${{ inputs.target }}"

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region                ${{ secrets.AWS_REGION }}
          aws configure set cli_pager             ""

      - name: Write kubeconfig
        run: |
          mkdir -p /tmp/kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > /tmp/kube/k3s.yaml
          chmod 600 /tmp/kube/k3s.yaml

      # 0. Expand — add NEW_KEY alongside OLD_KEY in Secrets Manager
      - name: Expand secret (superset with both OLD and NEW values)
        run: |
          CURRENT=$(aws --endpoint-url $SM_ENDPOINT secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" --query SecretString --output text)

          OLD_VALUE=$(echo "$CURRENT" | jq -r '."${{ inputs.secret_key }}"')
          EXPANDED=$(echo "$CURRENT" | jq \
            --arg key "${{ inputs.secret_key }}" \
            --arg newval "${{ inputs.new_secret_value }}" \
            --arg oldval "$OLD_VALUE" \
            '. + {($key): $newval, ($key + "_PREVIOUS"): $oldval}')

          aws --endpoint-url $SM_ENDPOINT secretsmanager update-secret \
            --secret-id "$SECRET_ID" \
            --secret-string "$EXPANDED"

      # 3. Apply superset k8s secret so new pods pick up NEW_KEY
      - name: Apply expanded secret to k8s
        env:
          KUBECONFIG: /tmp/kube/k3s.yaml
        run: |
          K8S_SECRET_NAME=$([[ "${{ inputs.target }}" == "fraud-api" ]] && echo "fraud-detection-secret" || echo "mle-pipeline-secret")
          
          aws --endpoint-url $SM_ENDPOINT secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString --output text \
          | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              print(f'{k}={v}')
          " > /tmp/rotation.env
          
          kubectl create secret generic $K8S_SECRET_NAME \
            --from-env-file=/tmp/rotation.env \
            --namespace default \
            --dry-run=client -o yaml | kubectl apply -f -
          
          rm /tmp/rotation.env

      # 4. Rolling update — triggers a new rollout, old pods keep old creds from prior k8s secret
      - uses: azure/setup-helm@v4

      - name: Trigger rolling update (fraud-api)
        if: inputs.target == 'fraud-api'
        env:
          KUBECONFIG: /tmp/kube/k3s.yaml
        run: |
          helm upgrade fraud-detection \
            ./platform-gitops/helm/fraud_detection \
            --namespace default \
            --set podAnnotations.rotatedAt="$(date -u +%s)" \
            --reuse-values \
            --wait --timeout 5m

      - name: Trigger rolling update (mle DAG pods use secret at pod launch — no rollout needed)
        if: inputs.target == 'mle-runtime'
        run: echo "mle-pipeline-secret updated; next DAG pod launch will pick up NEW_KEY."

      # 5. Contract — remove the _PREVIOUS key once rollout is confirmed complete
      - name: Contract secret (remove _PREVIOUS key)
        run: |
          CURRENT=$(aws --endpoint-url $SM_ENDPOINT secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" --query SecretString --output text)
          CONTRACTED=$(echo "$CURRENT" | jq 'del(."${{ inputs.secret_key }}_PREVIOUS")')
          aws --endpoint-url $SM_ENDPOINT secretsmanager update-secret \
            --secret-id "$SECRET_ID" \
            --secret-string "$CONTRACTED"
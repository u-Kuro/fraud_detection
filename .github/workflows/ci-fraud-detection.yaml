name: CI — Fraud Detection

on:
  push:
    paths:
      - "services/fraud_detection/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12.13" }

      - run: pip install uv
      - run: uv sync --frozen --group fraud_detection --group dev --no-install-project

      - name: Lint
        run: uv run ruff check services/fraud_detection shared

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region                ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws --endpoint-url http://ministack:4566 ecr get-login-password \
            | docker login --username AWS --password-stdin localhost:4566

      - name: Build and push
        env:
          REPO: localhost:4566/000000000000.dkr.ecr.us-east-1.amazonaws.com/fraud-detection
        run: |
          docker build \
            --build-arg FRAUD_DETECTION_PORT=30000 \
            -t $REPO:${{ github.sha }} \
            -t $REPO:latest \
            -f services/fraud_detection/Dockerfile .
          docker push $REPO:${{ github.sha }}
          docker push $REPO:latest
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd-fraud-detection.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
name: CI — Drift Monitor (Lint + Build + Push ECR)

on:
  push:
    paths:
      - "services/drift_monitor/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
    branches: ["**"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen --group drift_monitor --group dev --no-install-project

      - name: Lint
        run: uv run ruff check services/drift_monitor shared

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region                ${{ secrets.AWS_REGION }}
          aws configure set cli_pager             ""

      - name: Login to ECR
        run: |
          aws --endpoint-url http://ministack:4566 ecr get-login-password \
            | docker login --username AWS --password-stdin localhost:4566

      - name: Build and push
        env:
          REPO: localhost:4566/000000000000.dkr.ecr.us-east-1.amazonaws.com/fraud-detection-drift-monitor
        run: |
          docker build \
            -t $REPO:${{ github.sha }} \
            -t $REPO:latest \
            -f services/drift_monitor/Dockerfile \
            .
          docker push $REPO:${{ github.sha }}
          docker push $REPO:latest
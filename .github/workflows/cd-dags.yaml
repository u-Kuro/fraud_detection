name: CD — Sync DAGs to S3 (MWAA)

on:
  push:
    paths:
      - "dags/**"
    branches: [main]

jobs:
  sync-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check DAGs
        run: |
          python - <<'EOF'
          import ast, glob, sys
          errors = []
          for f in sorted(glob.glob("dags/*.py")):
              try:
                  ast.parse(open(f).read())
                  print(f"  OK  {f}")
              except SyntaxError as e:
                  errors.append(f)
                  print(f"  ERR {f}: {e}")
          if errors:
              sys.exit(1)
          EOF

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region                ${{ secrets.AWS_REGION }}
          aws configure set cli_pager             ""

      - name: Sync DAGs to S3
        run: |
          aws --endpoint-url http://ministack:4566 s3 sync \
            ./dags/ \
            s3://fraud-detection-dags/dags/ \
            --delete

      # Sync the mle-pipeline-secret to k8s so DAG pods always have fresh credentials
      - name: Write kubeconfig
        run: |
          mkdir -p /tmp/kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > /tmp/kube/k3s.yaml
          chmod 600 /tmp/kube/k3s.yaml

      - name: Sync mle-pipeline-secret from Secrets Manager
        env:
          KUBECONFIG: /tmp/kube/k3s.yaml
        run: |
          aws --endpoint-url http://ministack:4566 secretsmanager get-secret-value \
            --secret-id /fraud-detection/mle-runtime \
            --query SecretString --output text \
          | python3 -c "
          import json, sys
          for k, v in json.load(sys.stdin).items():
              if not k.endswith('_PREVIOUS'):
                  print(f'{k}={v}')
          " > /tmp/mle-runtime.env
          
          kubectl create secret generic mle-pipeline-secret \
            --from-env-file=/tmp/mle-runtime.env \
            --namespace default \
            --dry-run=client -o yaml | kubectl apply -f -
          
          rm /tmp/mle-runtime.env
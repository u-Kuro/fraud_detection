name: CI — Atlas Migrations

on:
  push:
    paths:
      - "db/migrations/**"
      - "db/atlas.hcl"
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      POSTGRES_VERSION: "15"
      FRAUD_DETECTION_DB_NAME: fraud_detection
      POSTGRES_CONNECTION_URI: ${{ secrets.POSTGRES_CONNECTION_URI }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Atlas CLI
        run: curl -sSf https://atlasgo.sh | sh

      - name: Lint migrations
        working-directory: db
        run: atlas migrate lint --env ci --git-base origin/main

  apply:
    needs: lint
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd-atlas.yml
    secrets: inherit
backendStore:
  databaseMigration: true
  postgres:
    enabled: true
#   host: [dynamic]
#   port: [dynamic]
#   database: [dynamic]
#   user: [dynamic]
#   password: [dynamic]

artifactRoot:
  s3:
    enabled: true
    path: "artifacts"
#   awsAccessKeyId: [dynamic]
#   awsSecretAccessKey: [dynamic]
  proxiedArtifactStorage: true # Changes destination host from s3 to mlflow

extraFlags:
  - serveArtifacts # Enables mlflow to proxy artifact connection from s3 (uploads/downloads)

# extraEnvVars:
#   MLFLOW_S3_ENDPOINT_URL: [dynamic]
#   WS_DEFAULT_REGION: [dynamic]

service:
  type: ClusterIP # Internal access only
# port: [dynamic]

# fullnameOverride: [dynamic] # Sets hostname
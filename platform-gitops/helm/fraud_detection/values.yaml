replicaCount: 1

image:
  # Repository is overridden by cd-fraud-api.yml --set image.repository=...
  repository: "000000000000.dkr.ecr.us-east-1.amazonaws.com/fraud-detection-api"
  tag: latest
  pullPolicy: Always

# ecr-secret is created by initialize-ministack-k3s.ps1 during Terraform EKS init.
imagePullSecrets:
  - name: ecr-secret

service:
  type: NodePort
  port: 30000
  nodePort: 30000

# fraud-detection-secret is created by cd-fraud-api.yml from /fraud-detection/fraud-api in
# Secrets Manager. Platform Terraform never sets its values.
secretName: fraud-detection-secret

# Updated by cd-fraud-api.yml --set podAnnotations.restartedAt=...
# to force a new ReplicaSet without changing the image tag.
podAnnotations: {}
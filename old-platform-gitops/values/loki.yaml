# Monolithic mode: all Loki components in one Pod
deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # Schema (TSDB is the current recommended index type)
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # S3 storage backend pointing to SeaweedFS
  storage:
    type: s3
    s3:
      endpoint: seaweedfs-filer.storage.svc.cluster.local:8333
      region: us-east-1
      secretAccessKey: fraud_detection
      accessKeyId: local-access-key
      s3ForcePathStyle: true
      # insecure: true means "use http not https"
      insecure: true
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

# Single binary replica settings
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi
    storageClass: standard

# Disable distributed components (not needed in single-binary mode)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable optional heavyweight sidecars
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
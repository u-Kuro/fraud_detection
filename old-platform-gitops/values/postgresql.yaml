auth:
  postgresPassword: "fraud_detection"
  username: "pguser"
  password: "fraud_detection"
  database: "platform"

image:
  repository: bitnamilegacy/postgresql
  tag: "16.3.0-debian-12-r22"

primary:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  persistence:
    enabled: true
    size: 8Gi
    storageClass: standard

readReplicas:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/postgres-exporter
    tag: "0.15.0-debian-12-r43"
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
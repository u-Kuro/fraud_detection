tempo:
  reportingEnabled: false
  structuredConfig:
    # Ingester: receive and buffer traces before writing to S3
    ingester:
      max_block_duration: 5m

    # Compactor: merge and compact blocks in S3
    compactor:
      compaction:
        block_retention: 48h

    # S3 storage backend pointing to SeaweedFS
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: http://seaweedfs-filer.storage.svc.cluster.local:8333
          region: us-east-1
          access_key: local-access-key
          secret_key: fraud_detection
          # insecure: true = use http
          insecure: true
          forcepathstyle: true
        wal:
          path: /var/tempo/wal

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

ingester:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

metaMonitoring:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

distributor:
  replicas: 1
compactor:
  replicas: 1
querier:
  replicas: 1
queryFrontend:
  replicas: 1
deployment:
  replicas: 1

service:
  type: LoadBalancer

ports:
  web:
    redirectTo:
      port: websecure
  websecure:
    tls:
      enabled: true

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

logs:
  general:
    level: INFO

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

rbac:
  enabled: true

ingressClass:
  enabled: true
  isDefaultClass: true
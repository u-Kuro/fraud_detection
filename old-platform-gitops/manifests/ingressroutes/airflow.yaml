apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airflow
  namespace: data-platform
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(airflow.local.test)
      kind: Rule
      services:
        - name: airflow-webserver
          port: 8080
  tls:
    secretName: airflow-tls-secret
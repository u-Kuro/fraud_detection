apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mlflow
  namespace: data-platform
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(mlflow.local.test)
      kind: Rule
      services:
        - name: mlflow
          port: 5000
  tls:
    secretName: mlflow-tls-secret
# SeaweedFS S3 IAM config — mounted by the filer pod at startup.
# Change accessKey / secretKey here AND in every values/*.yaml that references them.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-secret
  namespace: storage
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "local-access-key",
              "secretKey": "fraud_detection"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
# TLS certificate for Grafana
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: observability
spec:
  secretName: grafana-tls-secret
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
  dnsNames:
    - grafana.local.test
---

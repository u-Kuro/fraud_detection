# Step 2: generate the root CA certificate (stored in cert-manager namespace)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: networking
spec:
  isCA: true
  commonName: local-platform-ca
  secretName: local-ca-secret
  duration: 87600h   # 10 years
  renewBefore: 720h  # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
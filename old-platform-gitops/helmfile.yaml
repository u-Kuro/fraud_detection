repositories:
  - name: traefik
    url: https://traefik.github.io/charts
  - name: jetstack
    url: https://charts.jetstack.io
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: seaweedfs
    url: https://seaweedfs.github.io/seaweedfs/helm
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana-community
    url: https://grafana-community.github.io/helm-charts
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: apache-airflow
    url: https://airflow.apache.org
  - name: community-charts
    url: https://community-charts.github.io/helm-charts

releases:
  # networking
  - name: traefik
    namespace: networking
    chart: traefik/traefik
    version: "30.1.0"
    values:
      - values/traefik.yaml

  - name: cert-manager
    namespace: networking
    chart: jetstack/cert-manager
    version: "1.15.3"
    values:
      - values/cert-manager.yaml
    needs:
      - networking/traefik

  # storage
  - name: postgresql
    namespace: storage
    chart: bitnami/postgresql
    version: "15.5.19"
    values:
      - values/postgresql.yaml
    disableValidationOnInstall: true
    needs:
      - observability/kube-prometheus-stack
    hooks:
      - events: [ "postsync" ]
        command: kubectl
        args: [ "apply", "-f", "manifests/jobs/postgresql-init-databases.yaml" ]
      - events: [ "postsync" ]
        command: kubectl
        args: [ "wait", "--for=condition=complete", "job/postgresql-init-databases", "-n", "storage", "--timeout=120s" ]

  - name: seaweedfs
    namespace: storage
    chart: seaweedfs/seaweedfs
    version: "4.31.0"
    values:
      - values/seaweedfs.yaml
    needs:
      - storage/postgresql
    hooks:
      - events: [ "presync" ]
        command: kubectl
        args: [ "apply", "-f", "manifests/secrets/seaweedfs-s3-secret.yaml" ]
      - events: [ "postsync" ]
        command: kubectl
        args: [ "apply", "-f", "manifests/jobs/seaweedfs-init-buckets.yaml" ]

  # observability
  - name: kube-prometheus-stack
    namespace: observability
    chart: prometheus-community/kube-prometheus-stack
    version: "86.1.1"
    values:
      - values/kube-prometheus-stack.yaml
    disableValidationOnInstall: true
    hooks:
      - events: [ "presync" ]
        command: kubectl
        args: [ "apply", "-f", "manifests/secrets/thanos-objstore-secret.yaml" ]

  - name: thanos
    namespace: observability
    chart: bitnami/thanos
    version: "17.3.1"
    values:
      - values/thanos.yaml
    needs:
      - observability/kube-prometheus-stack
      - storage/seaweedfs

  - name: loki
    namespace: observability
    chart: grafana-community/loki
    version: "17.1.6"
    values:
      - values/loki.yaml
    disableValidationOnInstall: true
    needs:
      - observability/kube-prometheus-stack
      - storage/seaweedfs

  - name: tempo
    namespace: observability
    chart: grafana-community/tempo-distributed
    version: "2.23.4"
    values:
      - values/tempo.yaml
    disableValidationOnInstall: true
    needs:
      - observability/kube-prometheus-stack
      - storage/seaweedfs

  - name: otel-collector
    namespace: observability
    chart: open-telemetry/opentelemetry-collector
    version: "0.115.0"
    values:
      - values/otel-collector.yaml
    disableValidationOnInstall: true
    needs:
      - observability/kube-prometheus-stack
      - observability/loki
      - observability/tempo

  # data-platform
  - name: airflow
    namespace: data-platform
    chart: apache-airflow/airflow
    version: "1.15.0"
    values:
      - values/airflow.yaml
    disableValidationOnInstall: true
    timeout: 600
    needs:
      - observability/kube-prometheus-stack
      - storage/postgresql

  - name: mlflow
    namespace: data-platform
    chart: community-charts/mlflow
    version: "0.7.19"
    values:
      - values/mlflow.yaml
    disableValidationOnInstall: true
    needs:
      - observability/kube-prometheus-stack
      - data-platform/airflow
      - storage/postgresql
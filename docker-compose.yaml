# docker compose up -d --wait
services:
  ministack:
    image: ministackorg/ministack
    container_name: ministack
    networks:
      - ministack_network
    ports:
      - "4566:4566"
    environment:
      DOCKER_NETWORK: ministack_network
      PERSIST_STATE: 1
      S3_PERSIST: 1
      RDS_PERSIST: 1
      DSQL_PERSIST: 1
      LOG_LEVEL: DEBUG
    volumes:
      - ministack_data:/tmp/ministack_data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  ministack_data:

networks:
  ministack_network:
    name: ministack_network

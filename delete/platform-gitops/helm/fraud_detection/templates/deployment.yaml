apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fraud_detection.name" . }}
  labels:
    app: {{ include "fraud_detection.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fraud_detection.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "fraud_detection.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "fraud_detection.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
# Static MLflow values. Dynamic values (host, db, bucket, password)
# are injected via Terraform set{} / set_sensitive{} blocks.
backendStore:
  databaseMigration: true   # runs schema migrations on startup
  postgres:
    enabled: true

artifactRoot:
  proxiedArtifactStorage: true
  s3:
    enabled: true

# serveArtifacts → --serve-artifacts flag: proxies artifact uploads/downloads
# through the MLflow server instead of redirecting clients to S3 directly.
extraFlags:
  - serveArtifacts

service:
  type: ClusterIP
[project]
name = "fraud-detection"
version = "0.1.0"
requires-python = "==3.12.11"

[dependency-groups]
archive = [
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    # Shared
    "boto3>=1.43.77",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=1.4.54",
]
drift_check = [
    "evidently>=0.7.21",
    "mlflow-skinny>=3.2.0",
    "pandas>=2.3.3",
    # Shared
    "boto3>=1.43.77",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=1.4.54",
]
fraud_detection = [
    "fastapi>=0.141.1",
    "mlflow-skinny>=3.2.0",
    "pandas>=2.3.3",
    "slack-bolt>=1.30.0",
    # Shared
    "boto3>=1.43.77",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=1.4.54",
]
train_model = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.1",
    "mlflow-skinny>=3.2.0",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
    # Shared
    "boto3>=1.43.77",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=1.4.54",
]
dev = [
    # Apache Airflow (additionals)
    "apache-airflow>=3.0.6",
    "apache-airflow-providers-amazon>=9.12.0",
    "apache-airflow-providers-cncf-kubernetes>=10.7.0",
    "apache-airflow-providers-http>=5.3.3",
    "apache-airflow-providers-postgres>=6.2.3",
    "apache-airflow-providers-slack>=9.1.4",
    "mlflow-skinny>=3.2.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.15.0",
    # Notebooks
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.2.0",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=1.4.54",
    "xgboost>=3.4.1",
    # Tests
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "pytest-mock>=3.15.1",
    # Tools
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    # Helpers
    "boto3-stubs[mwaa,s3]>=1.43.77",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow-stubs>=20.0.0.20260819",
    "matplotlib-stubs>=0.3.11",
    "mypy>=2.3.1",
    "ruff>=0.16.4",
    "types-seaborn>=0.13.2.20260728",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = []

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
constraint-dependencies = [
    # Apache Airflow v3.0.6-python3.12 constraint
    "apache-airflow==3.0.6",
    "apache-airflow-providers-amazon==9.12.0",
    "apache-airflow-providers-cncf-kubernetes==10.7.0",
    "apache-airflow-providers-http==5.3.3",
    "apache-airflow-providers-postgres==6.2.3",
    "apache-airflow-providers-slack==9.1.4",
    "mlflow-skinny==3.2.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.15.0"
]

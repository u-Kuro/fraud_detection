[project]
name = "fraud-detection"
version = "0.1.0"
requires-python = "==3.12.13"

[dependency-groups]
archive = [
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    # Shared
    "boto3>=1.43.83",
    "mlflow-skinny>=3.15.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    # sqlalchemy dependendencies
    "psycopg2-binary>=2.9.12",
    # mlflow-skinny dependencies
    "alembic>=1.19.1",
]
drift_check = [
    "evidently>=0.7.21",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    # Shared
    "boto3>=1.43.83",
    "mlflow-skinny>=3.15.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    # sqlalchemy dependendencies
    "psycopg2-binary>=2.9.12",
    # mlflow-skinny dependencies
    "alembic>=1.19.1",
]
fraud_detection = [
    "fastapi>=0.136.3",
    "pandas>=2.3.3",
    "slack-bolt>=1.30.0",
    # Shared
    "boto3>=1.43.83",
    "mlflow-skinny>=3.15.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    # sqlalchemy dependendencies
    "psycopg2-binary>=2.9.12",
    # mlflow-skinny dependencies
    "alembic>=1.19.1",
]
train_model = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
    # Shared
    "boto3>=1.43.83",
    "mlflow-skinny>=3.15.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    # sqlalchemy dependendencies
    "psycopg2-binary>=2.9.12",
    # mlflow-skinny dependencies
    "alembic>=1.19.1",
]
dags = [
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-amazon>=9.34.0",
    "apache-airflow-providers-cncf-kubernetes>=10.21.0",
    "apache-airflow-providers-http>=6.0.5",
    "apache-airflow-providers-postgres>=7.0.1",
    "apache-airflow-providers-slack>=9.10.2",
    "mlflow-skinny>=3.15.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]
test = [
    "mock-open>=1.4.0",
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "pytest-mock>=3.15.1",
]
dev = [
    # Notebooks
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.2",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.4.1",
    # Tools
    "fastapi>=0.136.3",
    "uvicorn>=0.52.4",
    # Helpers
    "boto3-stubs[mwaa,s3]>=1.43.83",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow-stubs>=20.0.0.20260819",
    "matplotlib-stubs>=0.3.11",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "types-seaborn>=0.13.2.20260728",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "services/archive/tests",
    "services/drift_check/tests",
    "services/fraud_detection/tests",
    "services/train_model/tests",
    "services/shared/tests",
    "tests/dags",
]
python_files = ["[a-z]*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
env = [
    # services/shared — MLflow
    "MLFLOW_WORKSPACE=test-0123456789",
    # services/shared — S3
    "S3_BUCKET_NAME=test-bucket",
    # services/shared — Slack
    "SLACK_BOT_TOKEN=test-slack-bot-token",
    "SLACK_APP_TOKEN=test-slack-app-token",
    "SLACK_SIGNING_SECRET=test-slack-signing-secret",
    "SLACK_CHANNEL_ID=C000000000",
    # services/shared — MWAA
    "MWAA_ENVIRONMENT_NAME=test-mwaa-environment",
    # services/archive
    "TRANSACTION_INFERENCES_ISO_DATETIME_CUTOFF=2025-01-01T00:00:00+00:00",
    # services/drift_check
    "ACTIVE_MODEL_DEPLOYMENT_MLFLOW_RUN_ID=test-run-id-000000000000",
    # dags/shared — ECR
    "DRIFT_CHECK_IMAGE=000000000000.dkr.ecr.us-east-1.amazonaws.com/drift-check:test",
    "TRAIN_MODEL_IMAGE=000000000000.dkr.ecr.us-east-1.amazonaws.com/train-model:test",
    "ARCHIVE_IMAGE=000000000000.dkr.ecr.us-east-1.amazonaws.com/archive:test",
    # dags/shared — GitHub (AIRFLOW_VAR_ prefix)
    "AIRFLOW_VAR_GITHUB_CONNECTION_ID=github_default",
    # dags/shared — K8s (AIRFLOW_VAR_ prefix)
    "AIRFLOW_VAR_K8S_CONNECTION_ID=kubernetes_default",
    "AIRFLOW_VAR_K8S_NAMESPACE=airflow",
    "AIRFLOW_VAR_K8S_BASE_CONFIG_MAP_NAME=base-config-map",
    "AIRFLOW_VAR_K8S_BASE_SECRET_NAME=base-secret",
    "AIRFLOW_VAR_K8S_DOCKER_REGISTRY_SECRET_NAME=docker-registry-secret",
    # dags/shared — MLflow (AIRFLOW_VAR_ prefix)
    "AIRFLOW_VAR_MLFLOW_TRACKING_URI=http://localhost:5000",
    "AIRFLOW_VAR_MLFLOW_TRACKING_USERNAME=mlflow",
    "AIRFLOW_VAR_MLFLOW_TRACKING_PASSWORD=mlflow",
    "AIRFLOW_VAR_MLFLOW_WORKSPACE=default",
    # dags/shared — Postgres (AIRFLOW_VAR_ prefix)
    "AIRFLOW_VAR_POSTGRES_CONNECTION_ID=postgres_default",
    # dags/shared — S3 (AIRFLOW_VAR_ prefix)
    "AIRFLOW_VAR_S3_CONNECTION_ID=aws_default",
    "AIRFLOW_VAR_S3_BUCKET=mle",
    # dags/shared — Slack (AIRFLOW_VAR_ prefix)
    "AIRFLOW_VAR_SLACK_CONNECTION_ID=slack_default",
    "AIRFLOW_VAR_SLACK_CHANNEL_ID=C000000000",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
constraint-dependencies = [
    # Apache Airflow 3.3.1-python3.12 constraints (https://raw.githubusercontent.com/apache/airflow/refs/tags/constraints-3.3.1/constraints-3.12.txt)
    "apache-airflow==3.3.1",
    "apache-airflow-providers-amazon==9.34.0",
    "apache-airflow-providers-cncf-kubernetes==10.21.0",
    "apache-airflow-providers-http==6.0.5",
    "apache-airflow-providers-postgres==7.0.1",
    "apache-airflow-providers-slack==9.10.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # MLflow constraints
    "mlflow==3.15.2",
    "mlflow-skinny==3.15.2",
]

[project]
name = "fraud-detection"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core — needed by both API and notebook
    "mlflow>=3.12.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "torch>=2.12.0",
    # API serving — needed by Docker
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # DB connection — needed by API (inference logging) and scripts
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
    # Monitoring — Evidently drift reports (run in scripts/, not in Docker)
    "evidently>=0.7.21",
    "ipykernel>=7.2.0",
]

[dependency-groups]
dev = [
    # Notebook-only packages — Docker skips these with --no-dev
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "imbalanced-learn>=0.14.1",
    "kaleido>=0.2.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.5",
    "optuna>=4.8.0",
    "pandas-stubs>=3.0.0.260204",
    "plotly>=5.24.1",
    "python-dotenv>=1.2.2",
    "shap>=0.50.0",
    "tqdm>=4.67.3",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    # shap dependency
    "numba>=0.61.0",
    # Testing
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-env>=1.6.0",
    # Lint/type checker
    "ruff>=0.15.13",
    "mypy>=2.1.0",
]

[tool.pytest.ini_options]
env = [
    "POSTGRES_USER=test_user",
    "POSTGRES_PASSWORD=test_password",
    "POSTGRES_PORT=5432",
    "POSTGRES_HOST=localhost",
    "FRAUD_DETECTION_DB=test_db",
    "MLFLOW_TRACKING_URI=http://localhost:5000",
    "MLFLOW_MODEL_URI=models:/test_model/1",
    "MLFLOW_MODEL_FLAVOR=sklearn",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

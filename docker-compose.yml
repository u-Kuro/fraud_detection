services:
  # PostgreSQL Initialization
  postgres:
    build:
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres
      FRAUD_DETECTION_DB: ${FRAUD_DETECTION_DB}
      MLFLOW_DB: ${MLFLOW_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: >
        CMD-SHELL
          psql -U $$POSTGRES_USER -d $$FRAUD_DETECTION_DB -tAc "SELECT 1 FROM information_schema.tables WHERE table_name='deployed_models'" | grep -q 1 &&
          psql -U $$POSTGRES_USER -d $$FRAUD_DETECTION_DB -tAc "SELECT 1 FROM model_training_metadata LIMIT 1" | grep -q 1 &&
          psql -U $$POSTGRES_USER -d $$FRAUD_DETECTION_DB -tAc "SELECT 1 FROM transaction_inferences LIMIT 1" | grep -q 1 &&
          psql -U $$POSTGRES_USER -d $$MLFLOW_DB -tAc "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # MLflow Tracking Server
  mlflow:
    build:
      dockerfile: mlflow/Dockerfile
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    volumes:
      - ./models:/mlflow/models
    command: >
      mlflow server
        --host 0.0.0.0
        --port ${MLFLOW_PORT}
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${MLFLOW_DB}
        --artifacts-destination /mlflow/models
        --serve-artifacts
        --allowed-hosts ${MLFLOW_ALLOWED_HOSTS}
        --cors-allowed-origins ${MLFLOW_CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:${MLFLOW_PORT}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prediction API
  api:
    build:
      dockerfile: api/Dockerfile
      args:
        - API_PORT=${API_PORT}
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: postgres
      FRAUD_DETECTION_DB: ${FRAUD_DETECTION_DB}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT}
      MLFLOW_MODEL_URI: ${MLFLOW_MODEL_URI}
      MLFLOW_MODEL_FLAVOR: ${MLFLOW_MODEL_FLAVOR}
    volumes:
      - ./models:/mlflow/models
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:${API_PORT}/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  data:
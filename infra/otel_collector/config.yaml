# ──────────────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector — LGTM stack config
#
# Updated for FastAPIInstrumentor compatibility
# ─────────────────────────────────────────────
# ① filter/drop_noise REMOVED from collector — FastAPIInstrumentor's excluded_urls
#   suppresses health/metrics spans at the SDK level before they are ever created
#   or exported. Doing it in the collector wastes a full network round-trip.
#   Set OTEL_PYTHON_FASTAPI_EXCLUDED_URLS=health,ready,metrics (regex) in your app.
#
# ② spanmetrics dimensions updated for semconv dual-mode — FastAPIInstrumentor
#   defaults to OLD semconv (http.method / http.status_code). If you set
#   OTEL_SEMCONV_STABILITY_OPT_IN=http it switches to NEW semconv
#   (http.request.method / http.response.status_code). Use http/dup to emit both
#   during migration. This config lists both names so spanmetrics works either way.
#
# ③ http.server.duration vs spanmetrics duration — FastAPIInstrumentor emits
#   http.server.duration directly via SDK metrics (accurate, no sampling loss).
#   spanmetrics also produces a duration histogram from the same spans (carries
#   exemplars → Tempo links). Keep both; don't alert on both or you'll double-count.
#
# Unchanged from previous version
# ────────────────────────────────
# ④ memory_limiter   — prevents OOM crashes under load (must be first processor)
# ⑤ spanmetrics       — RED metrics from every span including Botocore + SQLAlchemy
# ⑥ servicegraph      — service-to-service dependency and latency metrics
# ⑦ health_check      — /health endpoint for liveness/readiness probes
# ⑧ pprof             — collector internal profiling
# ⑨ enable_open_metrics — required for Prometheus exemplar support
# ──────────────────────────────────────────────────────────────────────────────

extensions:
  health_check:
    endpoint: 0.0.0.0:${OTEL_HEALTH_CHECK_PORT}
  pprof:
    endpoint: 0.0.0.0:${OTEL_PPROF_PORT}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${OTEL_GRPC_PORT}
      http:
        endpoint: 0.0.0.0:${OTEL_HTTP_PORT}

processors:
  # Always first — shed load before processing if memory is tight.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resourcedetection:
    # docker — adds container.name, container.id, host.name
    # env    — reads OTEL_RESOURCE_ATTRIBUTES; inject service.version and
    #          deployment.environment from your deploy tooling via this env var
    detectors: [docker, env]
    timeout: 2s
    override: false

  # Always last — batch after all processors to maximize export efficiency.
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

connectors:

  # spanmetrics: generates RED metrics from every span — FastAPI HTTP spans,
  # SQLAlchemy query spans, Botocore AWS call spans, and your @observe spans —
  # all with exemplars pointing back to real traces in Tempo.
  #
  # SEMCONV NOTE: FastAPIInstrumentor emits OLD names by default.
  #   OTEL_SEMCONV_STABILITY_OPT_IN=http      → new names only
  #   OTEL_SEMCONV_STABILITY_OPT_IN=http/dup  → both (recommended during migration)
  # This config lists both old and new HTTP attribute names so spanmetrics works
  # regardless of which opt-in value you use. Extra dimensions that are absent
  # from a span are simply omitted from that metric series — no error.
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      # HTTP — old semconv (FastAPIInstrumentor default)
      - name: http.method
        default: unknown
      - name: http.status_code
      # HTTP — new stable semconv (OTEL_SEMCONV_STABILITY_OPT_IN=http)
      - name: http.request.method
        default: unknown
      - name: http.response.status_code
      # HTTP routing — present on FastAPI SERVER spans in both semconv versions
      - name: http.route
      # SQL — set by SQLAlchemyInstrumentor (stable, not migrating)
      - name: db.system
      - name: db.operation
      # AWS — set by BotocoreInstrumentor (stable, not migrating)
      - name: rpc.service
      - name: rpc.method
      # Error breakdown — set by @observe decorator
      - name: error.type
    exemplars:
      enabled: true
    dimensions_cache_size: 1000
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    namespace: traces
    metrics_flush_interval: 15s

  # servicegraph: correlates CLIENT and SERVER spans to draw service-to-service
  # dependency graphs. Powers the Service Graph panel in Tempo's datasource config.
  servicegraph:
    latency_histogram_buckets: [5ms, 25ms, 100ms, 250ms, 500ms, 1s, 5s]
    dimensions:
      - http.method
      - http.request.method  # new semconv fallback
      - db.system
    store:
      ttl: 2s
      max_items: 10000
    metrics_flush_interval: 60s

exporters:
  otlp/tempo:
    endpoint: tempo:${OTEL_GRPC_PORT}
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:${OTEL_PROMETHEUS_PORT}
    namespace: otelcol
    send_timestamps: true
    # Required for exemplar support — switches the scrape endpoint to OpenMetrics
    # format, the only format that carries exemplars. Also requires Prometheus to
    # be started with --enable-feature=exemplar-storage (or feature_flags in yml).
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  otlphttp/loki:
    endpoint: loki:${LOKI_HTTP_PORT}/otlp
    # trace_id and span_id are forwarded as structured metadata (not labels).
    # In Grafana: Loki datasource → Derived fields → field "traceID",
    # regex "trace_id=(\w+)", link to your Tempo datasource. This gives you
    # clickable trace links directly from log lines in Explore.

service:
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo, spanmetrics, servicegraph]

    metrics:
      # otlp receives: @observe RED metrics + FastAPIInstrumentor's http.server.*
      # spanmetrics / servicegraph: auto-derived from traces pipeline above
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]



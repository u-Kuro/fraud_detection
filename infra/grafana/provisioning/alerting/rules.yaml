apiVersion: 1
groups:
  - orgId: 1
    name: fraud-api-alerts
    folder: Fraud API
    interval: 1m
    rules:
      - uid: alert-latency-p95
        title: "p95 predict() latency > 500ms"
        for: 5m
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # fraud_api.predict.duration_seconds histogram from @track_latency
              expr: >-
                histogram_quantile(0.95,
                  sum(rate(otelcol_fraud_api_predict_duration_seconds_bucket[5m])) by (le)
                ) * 1000 > 500
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: "High prediction latency detected"
          description: "p95 predict() latency is above 500ms for 5 minutes."
        labels:
          severity: warning
        contactPoint: slack-alerts
      - uid: alert-http-error-rate
        title: "HTTP 5xx error rate > 1%"
        for: 5m
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # FastAPIInstrumentor emits http.server.request.duration
              expr: >-
                sum(rate(otelcol_http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                /
                sum(rate(otelcol_http_server_request_duration_seconds_count[5m])) > 0.01
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: "Elevated API error rate"
          description: "HTTP 5xx rate exceeded 1% for 5 minutes."
        labels:
          severity: critical
        contactPoint: slack-alerts
      - uid: alert-drift-share
        title: "Feature drift share > 30%"
        for: 5m
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # DRIFT_SHARE OTel gauge from telemetry/metrics.py
              expr: otelcol_fraud_api_drift_share > 0.30
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: "Data drift detected"
          description: "More than 30% of features show drift."
        labels:
          severity: warning
        contactPoint: slack-alerts
      - uid: alert-no-requests
        title: "No HTTP requests for 5 minutes"
        for: 5m
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: sum(rate(otelcol_http_server_request_duration_seconds_count[5m])) == 0
              intervalMs: 1000
              maxDataPoints: 43200
        annotations:
          summary: "Prediction volume dropped to zero"
          description: "No HTTP requests received in 5 minutes."
        labels:
          severity: critical
        contactPoint: slack-alerts
backendStore:
  databaseMigration: true
  postgres:
    enabled: true
#   host: [dynamic]
#   port: [dynamic]
#   database: [dynamic]
#   user: [dynamic]
#   password: [dynamic]

artifactRoot:
  s3:
    enabled: true
    path: "artifacts"
#   awsAccessKeyId: [dynamic]
#   awsSecretAccessKey: [dynamic]
#   bucket: [dynamic]
  proxiedArtifactStorage: true # Changes destination host from s3 to mlflow

extraFlags:
  - serveArtifacts # Enables mlflow to proxy artifact connection from s3 (uploads/downloads)
  - enable-workspaces

# extraEnvVars:
#   MLFLOW_S3_ENDPOINT_URL: [dynamic]
#   AWS_DEFAULT_REGION: [dynamic]

auth:
  enabled: true
  defaultPermission: MANAGE
  postgres:
    enabled: true
#   host: [dynamic]
#   port: [dynamic]
#   database: [dynamic]
#   user: [dynamic]
#   password: [dynamic]

# flaskServerSecretKey: [dynamic] # Avoids unexpected logout

service:
  type: ClusterIP # Internal access only
  containerPort: 8080
# port: [dynamic] # service port (HTTP)

# fullnameOverride: [dynamic] # Sets hostname